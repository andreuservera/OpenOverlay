name: Release

# Cutting a release: put the version's entry at the top of CHANGELOG.md, commit it, then either
#   - git tag vX.Y.Z && git push origin vX.Y.Z, or
#   - Actions tab → Release → Run workflow (creates the tag from the top CHANGELOG.md entry).
# This workflow builds a self-contained installer via Velopack and publishes it to GitHub Releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The build stamps the version of the newest CHANGELOG.md entry and that entry is the release
      # notes; the tag only starts the release, so it has to name the same version.
      - name: Read the version from CHANGELOG.md
        id: version
        shell: bash
        env:
          DOTNET_NOLOGO: true
        run: |
          version=$(dotnet msbuild IRacingOverlay.App/IRacingOverlay.App.csproj -getProperty:Version | tr -d '\r')
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the newest CHANGELOG.md entry ($version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # Notes cover every entry since the last published tag, so versions that were never released
          # on their own still reach the release page (later entries keep their heading).
          prev=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' | grep -vxF "$version" | sort -V | tail -n 1 || true)
          awk -v prev="$prev" '
            /^###?[ \t]+\[?v?[0-9]+\.[0-9]+\.[0-9]+/ {
              match($0, /[0-9]+\.[0-9]+\.[0-9]+/)
              if (++n > 1 && (prev == "" || substr($0, RSTART, RLENGTH) == prev)) exit
              if (n > 1) print
              next
            }
            n >= 1 && !/^[ \t]*---+[ \t]*$/' CHANGELOG.md > release-notes.md

      - name: Run tests
        run: dotnet test --configuration Release

      - name: Publish self-contained build
        run: dotnet publish IRacingOverlay.App/IRacingOverlay.App.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o publish-selfcontained

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.0 # keep in step with the Velopack package in IRacingOverlay.App.csproj

      - name: Download previous release (for delta patches)
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # fine to fail on the very first Velopack-packaged release — nothing to diff against yet

      - name: Pack installer
        run: >
          vpk pack
          --packId OpenOverlay
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish-selfcontained
          --packTitle "OpenOverlay"
          --packAuthors "OpenOverlay contributors"
          --mainExe OpenOverlay.exe
          --icon IRacingOverlay.App/Assets/icon.ico
          --shortcuts Desktop,StartMenuRoot
          --releaseNotes release-notes.md

      # Manual runs have no tag yet, so create it after the build succeeded (a failed build leaves no tag).
      # `git tag` fails if the tag already exists, which stops a duplicate release.
      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Publish to GitHub Releases
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "OpenOverlay ${{ steps.version.outputs.tag }}"
          --tag ${{ steps.version.outputs.tag }}
